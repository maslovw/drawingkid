# /etc/nginx/sites-available/play on lsp: kids' games at play.maslovw.de, one folder each.
#   /drawingkid/          the Drawing Kid web app (static, /var/www/play/drawingkid)
#   /api/drawingkid/      the Drawing Kid server (127.0.0.1:8787), also called by the iPad app
#                         and by App Store Server Notifications
# Public on purpose. TLS is added by: certbot --nginx -d play.maslovw.de

limit_req_zone $binary_remote_addr zone=play_api:10m rate=30r/m;

server {
    server_name play.maslovw.de;
    root /var/www/play;

    # The family-login cookie is set for all of .maslovw.de; nothing here needs it, so
    # it never reaches the games or their servers.
    proxy_set_header Cookie "";

    location = / {
        return 302 /drawingkid/;
    }

    location /drawingkid/ {
        try_files $uri $uri/ =404;
        # No build step, so no hashed file names: check for changes on every load.
        add_header Cache-Control "no-cache";
    }

    location /api/drawingkid/ {
        limit_req zone=play_api burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie "";
        # Image generation takes 10-60 s.
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    listen 80;
}
